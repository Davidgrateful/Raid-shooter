name: CI

# The point of this workflow is that a regression is caught here rather than by
# someone noticing it several phases later. It runs the same checks the project
# has been verified with by hand: a real production build, TypeScript, lint, a
# syntax check across the vanilla-JS engine, and the Playwright suite driving
# the built app on desktop and phone-landscape viewports.

# Development happens on claude/** feature branches, often with no PR open for
# days. Triggering only on main/master + pull_request meant this workflow had
# never run once - the checks were real but nothing was ever running them.
# workflow_dispatch is here so it can also be kicked by hand.
on:
  pull_request:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types, lint, engine syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: TypeScript
        run: npm run typecheck

      # A ratchet, not a gate: the tree carries 21 pre-existing errors (mostly
      # react-compiler rules from eslint-config-next). Failing on those would
      # make CI red on day one and teach everyone to ignore it. This fails when
      # the count goes UP, which is the regression we actually care about.
      - name: Lint (no new errors)
        run: npm run lint:ci

      # The engine is plain JS with no build step, so nothing else would catch
      # a syntax error in it before it reached a player's browser.
      - name: Engine syntax
        run: |
          for f in public/game/*.js; do
            node --check "$f" || exit 1
          done
          echo "all $(ls public/game/*.js | wc -l) engine files parse"

  e2e:
    name: playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # hud-matrix sweeps its own five viewport/loadout combinations, so it
        # is a project in its own right rather than a third viewport.
        project: [desktop, phone-landscape, hud-matrix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The config builds and starts the app itself (webServer), so this is the
      # same production bundle a player would load.
      - name: Run suite
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
